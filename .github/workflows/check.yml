name: 构建与部署检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: littlenotes_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d littlenotes_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm build && pnpm test
      - run: pnpm test:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:postgres --e2e
        env:
          TEST_DATABASE_URL: postgresql://test:test_ci_only@127.0.0.1:5432/littlenotes_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 浏览器检查结果
          path: .cache/postgres-test-*/test-results/
          include-hidden-files: true
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 预拉取 CI 数据库镜像
        # GitHub runners can use Docker Hub; prefill the official ECR alias used by deployment.
        # This avoids ECR anonymous pull throttling before the container smoke test starts.
        run: |
          docker pull docker.io/library/postgres:16-bookworm
          docker tag docker.io/library/postgres:16-bookworm public.ecr.aws/docker/library/postgres:16-bookworm
      - name: 临时容器配置（不发送真实邮件）
        run: |
          bash deploy/configure.sh
          sed -i 's/^SMTP_USER=.*/SMTP_USER=ci-unused@163.com/; s/^SMTP_AUTH_CODE=.*/SMTP_AUTH_CODE=ci-never-send/; s/^EMAIL_SMTP_VERIFIED=.*/EMAIL_SMTP_VERIFIED=1/' deploy/.env
      - run: bash deploy/deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-avatar-backup.mjs
      - run: node .github/scripts/deployment-smoke.mjs
      - name: 校验正式 HTTPS 配置（不开放公网）
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yaml exec -T \
            -e SITE_ADDRESS=https://littlenotes.cn -e ACME_EMAIL=test@example.com \
            web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: |
          sudo bash deploy/backup.sh
          backup=$(sudo find backups -name '*.dump' -type f | head -n 1)
          sudo bash deploy/verify-backup.sh "$backup"
      - name: 容器日志
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml logs --tail=100
      - name: 清理本次 CI 容器和数据
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml down -v
